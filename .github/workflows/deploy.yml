name: Vercel Preview Playwright

on:
  repository_dispatch:
    types:
      - vercel.deployment.success

jobs:
  test-preview:
    name: >-
      Test ${{ github.event.client_payload.project.name }}
    if: >-
      github.event.client_payload.environment == 'preview' &&
      (
        github.event.client_payload.project.name == 'ssr-themes-next' ||
        github.event.client_payload.project.name == 'ssr-themes-solid' ||
        github.event.client_payload.project.name == 'ssr-themes-start' ||
        github.event.client_payload.project.name == 'ssr-themes-astro' ||
        github.event.client_payload.project.name == 'ssr-themes-vue' ||
        github.event.client_payload.project.name == 'ssr-themes-svelte'
      )
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Playwright
        run: bunx playwright install --with-deps

      - name: Run deployed Playwright tests
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
          VERCEL_PROJECT: ${{ github.event.client_payload.project.name }}
        run: |
          case "$VERCEL_PROJECT" in
            ssr-themes-next)
              app=next
              ;;
            ssr-themes-solid)
              app=solid
              ;;
            ssr-themes-start)
              app=tanstack-start
              ;;
            ssr-themes-astro)
              app=astro
              ;;
            ssr-themes-vue)
              app=nuxt
              ;;
            ssr-themes-svelte)
              app=svelte
              ;;
          esac

          case "$DEPLOYMENT_URL" in
            http://*|https://*)
              ;;
            *)
              DEPLOYMENT_URL="https://$DEPLOYMENT_URL"
              ;;
          esac

          PLAYWRIGHT_APP="$app" \
            PLAYWRIGHT_BASE_URL="$DEPLOYMENT_URL" \
            bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.event.client_payload.project.name }}
          path: |
            playwright-report
            test-results

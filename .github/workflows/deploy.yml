name: Deploy Examples

on:
  push:
    branches:
      - '**'

jobs:
  deploy-and-test:
    name: >-
      Deploy and test ${{ matrix.app }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: next
            dir: examples/next
            project: ssr-themes-next
          - app: solid
            dir: examples/solid
            project: ssr-themes-solid
          - app: tanstack-start
            dir: examples/tanstack-start
            project: ssr-themes-start
          - app: astro
            dir: examples/astro
            project: ssr-themes-astro
          - app: nuxt
            dir: examples/nuxt
            project: ssr-themes-vue
          - app: svelte
            dir: examples/svelte
            project: ssr-themes-svelte
    concurrency:
      group: >-
        deploy-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: true

      - name: Setup Playwright
        run: bunx playwright install --with-deps

      - name: Deploy to Vercel
        id: deploy
        working-directory: ${{ matrix.dir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(bunx vercel deploy --yes --project ${{ matrix.project }})
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Run deployed Playwright tests
        run: bun run test:e2e
        env:
          CI: true
          PLAYWRIGHT_APP: ${{ matrix.app }}
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.app }}
          path: |
            playwright-report
            test-results

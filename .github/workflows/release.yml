name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./ssr-themes/package.json').version")
          expected="v$version"

          if [ "$RELEASE_TAG" != "$expected" ]; then
            printf 'Release tag %s does not match package version %s\n' "$RELEASE_TAG" "$expected" >&2
            exit 1
          fi

      - name: Run unit tests
        run: bun run test

      - name: Run format check
        run: bun run check-format

      - name: Run type checks
        run: bun run check-types

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Build workspace
        run: bun run build

      - name: Check npm package contents
        run: npm pack --dry-run
        working-directory: ssr-themes

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./ssr-themes/package.json').version")
          expected="v$version"

          if [ "$RELEASE_TAG" != "$expected" ]; then
            printf 'Release tag %s does not match package version %s\n' "$RELEASE_TAG" "$expected" >&2
            exit 1
          fi

      - name: Build package
        run: bun --filter ssr-themes build

      - name: Publish to npm
        run: npm publish
        working-directory: ssr-themes
